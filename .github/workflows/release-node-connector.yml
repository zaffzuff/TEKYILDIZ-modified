name: Release ZAF TECH Node Connector

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload"
        required: true
        default: "v0.2.4"
        type: string

permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/zaf-node-connector-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare ZAF TECH logo
        shell: powershell
        run: |
          choco install imagemagick.app -y --no-progress
          Copy-Item "..\..\public\zaf-tech-logo.png" "installer\zaf-tech-logo.png" -Force
          magick "installer/zaf-tech-logo.png" -background none -define icon:auto-resize=256,128,64,48,32,16 "installer/zaf-tech-logo.ico"
      - name: Install packaging dependencies
        run: npm install
      - name: Build Windows executable
        run: npm run build:win
      - name: Apply ZAF TECH executable icon and metadata
        shell: powershell
        run: |
          $inputFile = "dist/ZAF-TECH-Node-Connector.exe"
          $outputFile = "dist/ZAF-TECH-Node-Connector-branded.exe"
          & npx resedit-cli --in "$inputFile" --out "$outputFile" --icon "1,installer/zaf-tech-logo.ico" --product-name "ZAF TECH Node Connector" --file-description "Local read-only Pi Node diagnostics for ZAF TECH" --company-name "ZAF TECH - zaffzuff" --file-version "0.2.4.0" --product-version "0.2.4.0" --internal-name "ZAF-TECH-Node-Connector.exe"
          if ($LASTEXITCODE -ne 0) { throw "resedit-cli failed with exit code $LASTEXITCODE" }
          Move-Item -Force "$outputFile" "$inputFile"
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer-dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\ZAF-TECH-Node-Connector.iss"
      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $exeHash = (Get-FileHash "dist/ZAF-TECH-Node-Connector.exe" -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash "installer-dist/ZAF-TECH-Node-Connector-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          @("$exeHash  ZAF-TECH-Node-Connector.exe","$setupHash  ZAF-TECH-Node-Connector-Setup.exe") | Set-Content "ZAF-TECH-Node-Connector-SHA256SUMS.txt" -Encoding ascii
      - name: Upload assets to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if (-not $tag) { throw "Release tag could not be determined." }

          $releasesJson = gh release list --repo "$env:GITHUB_REPOSITORY" --limit 100 --json tagName | ConvertFrom-Json
          $releaseExists = $false
          if ($releasesJson) {
            $releaseExists = @($releasesJson | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          }

          if (-not $releaseExists) {
            Write-Host "Release $tag does not exist. Creating it..."
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "ZAF TECH Node Connector $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          } else {
            Write-Host "Release $tag already exists."
          }

          gh release upload $tag "dist/ZAF-TECH-Node-Connector.exe" "installer-dist/ZAF-TECH-Node-Connector-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }

          gh release upload $tag "ZAF-TECH-Node-Connector-SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release checksum upload failed with exit code $LASTEXITCODE" }

          Write-Host "Release assets uploaded successfully to $tag."
