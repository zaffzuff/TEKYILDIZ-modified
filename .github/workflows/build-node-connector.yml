name: Build ZAF TECH Node Connector

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/zaf-node-connector.mjs"
      - "tools/zaf-node-connector-package/**"
      - ".github/workflows/build-node-connector.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/zaf-node-connector-package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packaging dependencies
        run: npm install

      - name: Build Windows executable
        run: npm run build:win

      - name: Upload connector artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAF-TECH-Node-Connector-windows-x64
          path: tools/zaf-node-connector-package/dist/ZAF-TECH-Node-Connector.exe
