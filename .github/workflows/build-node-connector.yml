name: Build ZAF TECH Node Connector

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/zaf-node-connector.mjs"
      - "tools/zaf-node-connector-package/**"
      - ".github/workflows/build-node-connector.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/zaf-node-connector-package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare ZAF TECH logo
        shell: powershell
        run: |
          choco install imagemagick.app -y --no-progress
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/zaffzuff/ZAF-TECH/master/public/zaf-tech-logo.png" -OutFile "installer/zaf-tech-logo.png"
          magick "installer/zaf-tech-logo.png" -background none -define icon:auto-resize=256,128,64,48,32,16 "installer/zaf-tech-logo.ico"

      - name: Install packaging dependencies
        run: npm install

      - name: Build Windows executable
        run: npm run build:win

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer-dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\ZAF-TECH-Node-Connector.iss"

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $exeHash = (Get-FileHash "dist/ZAF-TECH-Node-Connector.exe" -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash "installer-dist/ZAF-TECH-Node-Connector-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  ZAF-TECH-Node-Connector.exe"
            "$setupHash  ZAF-TECH-Node-Connector-Setup.exe"
          ) | Set-Content "ZAF-TECH-Node-Connector-SHA256SUMS.txt" -Encoding ascii

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: ZAF-TECH-Node-Connector-SHA256
          path: tools/zaf-node-connector-package/ZAF-TECH-Node-Connector-SHA256SUMS.txt

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ZAF-TECH-Node-Connector-windows-x64
          path: tools/zaf-node-connector-package/dist/ZAF-TECH-Node-Connector.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ZAF-TECH-Node-Connector-Setup-windows-x64
          path: tools/zaf-node-connector-package/installer-dist/ZAF-TECH-Node-Connector-Setup.exe
